services:
  backend:
    build: ./lunchline-backend
    ports:
      - "3000:3000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./lunchline-frontend
    ports:
      - "8080:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  backend-data:
